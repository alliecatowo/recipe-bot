# Weekly version updates. Minor and patch bumps are grouped into one PR and
# auto-merged by .github/workflows/dependabot-automerge.yml once required CI is
# green; major bumps arrive as separate PRs labelled `major-update`.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: uv
  directory: /
  schedule:
    interval: weekly
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
