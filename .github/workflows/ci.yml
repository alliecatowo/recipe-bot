name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Dependency install (pdm.lock) is not green on main today: a pinned sdist fails to build
      # (needs pkg_resources). Syntax check only until that is fixed.
      - run: python -m compileall -q src
